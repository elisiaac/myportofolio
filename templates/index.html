{% extends 'base.html' %}
{% load static %}
{% block meta %}
    <title>{{ name }} - Portofolio</title>
{% endblock meta %}
{% block content %}
  <main>
        <!-- ini section hero (profile) -->
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="glass-card"></div>
                <div class="hero-identity">
                    <p class="hero-kicker">Information Systems &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <img class="avatar" src="/static/img/Elisia_Photo.png" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/elisiaac" target="_blank" class="social-btn">
                            <i class="fa-brands fa-github"></i>
                            <span class="social-text">GitHub</span>
                        </a>
                        <a href="https://www.instagram.com/elisiaac/?utm_source=ig_web_button_share_sheet" target="_blank" class="social-btn">
                            <i class="fa-brands fa-instagram"></i>
                            <span class="social-text">Instagram</span>
                        </a>
                        <a href="https://www.linkedin.com/in/elisiac" target="_blank" class="social-btn">
                            <i class="fa-brands fa-linkedin"></i>
                            <span class="social-text">LinkedIn</span>
                        </a>
                        <a href="mailto:elisiacatherine@gmail.com" class="social-btn">
                            <i class="fa-solid fa-envelope"></i>
                            <span class="social-text">Email</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>
    {% endblock content %}
